name: Check external links

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ "Gatsby Publish" ]
    types:
      - completed
    branches:
      - 'main'

defaults:
  run:
    shell: bash

concurrency:
  group: uses-github-api # do not allow any concurrency to avoid re-triggering the rate limiter

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read # to find the previous run and download its results
      issues: write
      repository-projects: read
      statuses: read
    if: github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: "npm" # this only caches global dependencies
      - run: npm ci --prefer-offline
      - name: Download Built Artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }} # token with actions:read permissions on target repo
          run-id: ${{ github.event.workflow_run.id }}
          path: public/
          name: site
      # see https://github.com/puppeteer/puppeteer/issues/12818
      - name: Disable AppArmor
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - run: npm run test:links
        continue-on-error: true # problems will be tracked by defects raised by the next job, not by build failures
        env:
          CI: true
          PATH_PREFIX: "${{ github.ref_name == 'main' && 'extensions' || '' }}"
          PATH_PREFIX_FLAG: "${{ github.ref_name == 'main' && '--prefix-paths' || '' }}"
      # Network errors are only reported if they also happened in the previous run, so fetch its results
      - name: Find previous run
        id: previous-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh run list -R ${{ github.repository }} --workflow check-external-links.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          echo "Previous successful run: ${id:-none}"
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Download previous results
        if: steps.previous-run.outputs.id != ''
        continue-on-error: true # the artifact may have expired, or pre-date this step; network errors then just wait one more run to be confirmed
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.previous-run.outputs.id }}
          path: previous-results/
          name: dead-link-results
      - name: Set up JBang
        uses: jbangdev/setup-jbang@main
      - name: Raise defects if needed
        run: |
          jbang site-validation/dead-link-issue.java \
            token=${{ secrets.GITHUB_TOKEN }} \
            issueRepo=${{ github.repository }} \
            runId=${{ github.run_id }} \
            siteUrl=https://quarkus.io/extensions \
            previousResults=previous-results/dead-link-check-results.json
        shell: bash
      - name: Save results for the next run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dead-link-results
          path: dead-link-check-results.json
          if-no-files-found: warn
          retention-days: 7
