name: Surge PR Preview

on:
  workflow_run:
    workflows: [ "Gatsby Publish" ]
    types:
      - completed
    branches-ignore:
      - 'main'


permissions:
  actions: read
  pull-requests: write
  packages: read

jobs:
  preview:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download PR Artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }} # token with actions:read permissions on target repo
          run-id: ${{ github.event.workflow_run.id }}
          name: site
      - name: Validate and expose PR number
        id: pr
        env:
          RAW_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if ! [[ "$RAW_PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number: $RAW_PR_NUMBER" >&2
            exit 1
          fi
          echo "id=$RAW_PR_NUMBER" >> $GITHUB_OUTPUT
      - name: Publishing to surge for preview
        id: deploy
        env:
          PR_ID: ${{ steps.pr.outputs.id }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: npx surge ./ --domain "https://extensions-quarkus-pr-${PR_ID}-preview.surge.sh" --token "$SURGE_TOKEN"
      - name: Update PR status comment on success
        uses: quarkusio/action-helpers@main
        with:
          action: maintain-one-comment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ steps.pr.outputs.id }}
          body: |
            🚀 PR Preview ${{ github.sha }} has been successfully built and deployed to https://extensions-quarkus-pr-${{ steps.pr.outputs.id }}-preview.surge.sh
            <!-- Sticky Pull Request Comment -->
          body-marker: <!-- Sticky Pull Request Comment -->
      - name: Update PR status comment on failure
        if: ${{ failure() }}
        uses: quarkusio/action-helpers@main
        with:
          action: maintain-one-comment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ steps.pr.outputs.id }}
          body: |
            😭 Deploy PR Preview failed.
            <img width="300" src="https://user-images.githubusercontent.com/507615/90250824-4e066700-de6f-11ea-8230-600ecc3d6a6b.png">
            <!-- Sticky Pull Request Comment -->
          body-marker: <!-- Sticky Pull Request Comment -->